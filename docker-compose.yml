services:
  postgres:
    image: postgres:16.14
    container_name: madbench-pg
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: tpch
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d tpch"]
      interval: 2s
      timeout: 5s
      retries: 30
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - max_connections=64
      - -c
      - random_page_cost=1.1

  mysql:
    image: mysql:8.4.10
    container_name: madbench-mysql
    environment:
      MYSQL_ROOT_PASSWORD: bench
      MYSQL_DATABASE: tpch
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
    ports:
      - "53306:3306"
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin -uroot -pbench ping --silent || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
    command:
      - --innodb-buffer-pool-size=1G
      - --local-infile=ON
      - --max-execution-time=600000
